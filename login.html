{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="fa-solid fa-cloud-arrow-up fa-3x mb-2"></i>
                <h4 class="fw-bold mb-0">Campus Portal Login</h4>
                <p class="small mb-0 opacity-75">Access Lost & Found Management System</p>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@campus.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Credentials Box -->
                <div class="p-3 bg-light rounded-3 border small">
                    <div class="fw-bold text-dark mb-1"><i class="fa-solid fa-key text-warning me-1"></i> Default Evaluation Credentials:</div>
                    <div class="text-muted">
                        <strong>Admin:</strong> <code>admin@campus.edu</code> / <code>admin123</code>
                    </div>
                </div>

                <div class="text-center mt-3 small">
                    <span>Don't have an account? </span>
                    <a href="{{ url_for('main.register') }}" class="fw-semibold text-primary text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
